name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install -y shfmt shellcheck
      - name: Check startup launcher syntax
        run: python3 -m py_compile platform/startup.py sdk/startup.py
      - name: Check Bash syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n
      - name: Check shell formatting
        run: git ls-files -z '*.sh' | xargs -0 -r shfmt -d -i 2 -ci
      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        image: [platform, sdk]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: false
